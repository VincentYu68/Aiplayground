name: Deploy Brickify to GitHub Pages

on:
  push:
    branches:
      # The branch this app is developed on. The older branch below is where it
      # started; it is kept so an older build can still be republished, but
      # nothing is pushed to it any more — two live branches would take turns
      # overwriting the one Pages site this repository has.
      - claude/photo-lego-manual-app-lufbep
      - claude/photo-lego-assembly-manual-otvt8e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A repository has exactly one Pages site, so two workflows publishing to it
# must not run at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # The default branch already publishes a different project at the site
      # root. Since there is only one site per repository, deploying this app
      # over it would take that one down — so the existing site is carried
      # through untouched and this app is mounted in a subdirectory beneath it.
      - name: Check out the site currently published at the root
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: site

      - name: Check out this app
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # Don't publish a build that does not pass; the suite takes a second.
      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Assemble the site
        run: |
          rm -rf site/.git
          rm -rf site/lego
          mkdir -p site/lego
          cp -R app/dist/. site/lego/
          # Vite emits files under assets/, and Jekyll would leave alone
          # anything starting with an underscore — belt and braces.
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Pages queues the deployment on its own backend after the artifact is
      # uploaded, and that queue has been sitting right at the action's limit:
      # 9m07s on one run, over ten minutes on the two either side of it, each
      # time with a green build and a successful upload behind it.
      #
      # The limit cannot be raised. The action clamps its own `timeout` input
      # to MAX_TIMEOUT = 600000 (see actions/deploy-pages, internal/deployment.js),
      # so passing a larger value is silently ignored — which it was, here, for
      # one commit. The only remedy left is to ask a second time.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy (second attempt)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
